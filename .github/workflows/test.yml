name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

      # mypy runs strict (see [tool.mypy] in pyproject.toml) but only over the
      # packages that currently pass. The rest of the tree carries ~180 pre-existing
      # errors; gating everything today would fail every PR regardless of its content.
      # This list is a ratchet: add a package here once it is clean, never remove one.
      - name: Mypy — strict, on the packages that pass
        run: uv run mypy src/hivdrwatch/dashboard src/hivdrwatch/cli
          src/hivdrwatch/ingest src/hivdrwatch/resistance
          src/hivdrwatch/align src/hivdrwatch/api
          src/hivdrwatch/storage src/hivdrwatch/cluster src/hivdrwatch/phylo
          foundation_models

      - name: Pytest
        env:
          # Never talk to real Sierra/NCBI in CI — the resistance client
          # honors this env var and returns cached fixtures only.
          HIVDRWATCH_OFFLINE: "1"
        run: uv run pytest tests/ -q --cov=hivdrwatch --cov=causal --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore

  # Detects a stale summary, nothing more. It compares the pointer digests recorded in the
  # committed summary.json, meta.input_dvc_md5 (Sierra results) and meta.curated_dvc_md5
  # (the curated table the countries and years come from), against the md5 in each committed
  # .dvc pointer, so it fires when `dvc add` moved either pointer after the summary was
  # exported. It does NOT verify the aggregation, and it does NOT detect a parquet that
  # disagrees with its own pointer: the only DVC remote is a MinIO on localhost
  # (.dvc/config), unreachable from a hosted runner, so CI never holds the data. The
  # *_file_md5 digests (of the files actually hashed at export time) are likewise
  # unverifiable here, and are not consulted. The page footer discloses when the Sierra
  # input's two digests differ.
  summary-input-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Summary input pointers match the DVC pointers
        run: |
          uv run python -c "
          import logging, sys
          from pathlib import Path
          from hivdrwatch.dashboard.export.summary import check_input_not_stale
          logging.basicConfig(level=logging.INFO, format='%(levelname)s %(message)s')
          sys.exit(check_input_not_stale(
              Path('src/hivdrwatch/dashboard/static/summary.json'),
              Path('data/interim/dr_results.parquet.dvc'),
              Path('data/interim/curated/aligned.parquet.dvc'),
          ))
          "
